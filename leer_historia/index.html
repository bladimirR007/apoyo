<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF a Excel - Historia Clínica</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 2rem; color: #333; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 1rem; }

        .funcionario-box {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .funcionario-box label {
            font-weight: 600;
            color: #4a5568;
            font-size: 0.95rem;
        }

        .funcionario-box input {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .funcionario-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .upload-area {
            border: 3px dashed #cbd5e0;
            border-radius: 12px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f7fafc;
            position: relative;
            z-index: 1;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .upload-area * { pointer-events: none; }

        .upload-area:hover, .upload-area.dragover {
            border-color: #667eea;
            background: #ebf4ff;
            transform: translateY(-2px);
        }

        .upload-area:active { transform: scale(0.99); }

        .upload-content svg { color: #667eea; margin-bottom: 15px; }
        .upload-content p { font-size: 1.1rem; margin-bottom: 8px; color: #4a5568; }
        .hint { color: #a0aec0; font-size: 0.9rem; }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-primary, .btn-success, .btn-secondary {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary { background: #667eea; color: white; }
        .btn-primary:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .btn-primary:disabled { background: #cbd5e0; cursor: not-allowed; transform: none; }

        .btn-success { background: #48bb78; color: white; }
        .btn-success:hover { background: #38a169; transform: translateY(-2px); }

        .btn-secondary { background: #edf2f7; color: #4a5568; }
        .btn-secondary:hover { background: #e2e8f0; }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .status.info { background: #ebf8ff; color: #2c5282; display: block; }
        .status.success { background: #f0fff4; color: #22543d; display: block; }
        .status.error { background: #fff5f5; color: #742a2a; display: block; }

        .preview { margin-top: 30px; }
        .preview h2 { margin-bottom: 15px; color: #2d3748; }

        .table-wrapper {
            overflow: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        table th, table td { padding: 12px 14px; border: 1px solid #e2e8f0; text-align: left; }
        table th {
            background: #667eea;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        table tr:nth-child(even) { background: #f7fafc; }
        table td { font-weight: 500; color: #2d3748; }

        /* Celdas editables */
        table td[contenteditable="true"] {
            cursor: text;
            outline: none;
            transition: background 0.15s;
        }
        table td[contenteditable="true"]:hover { background: #fffbeb; }
        table td[contenteditable="true"]:focus {
            background: #fef3c7;
            box-shadow: inset 0 0 0 2px #f59e0b;
            border-radius: 4px;
        }
        table td.val { color: #22543d; background: #f0fff4; }
        table td.missing { color: #cbd5e0; font-style: italic; font-weight: 400; }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .legend {
            margin-top: 12px;
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
            font-size: 0.8rem;
            color: #718096;
        }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .legend .dot { width: 10px; height: 10px; border-radius: 50%; }
        .legend .dot.ok { background: #48bb78; }
        .legend .dot.empty { background: #cbd5e0; }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            h1 { font-size: 1.5rem; }
            .actions { flex-direction: column; }
            .actions button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 → 📊 Historia Clínica a Excel</h1>
            <p class="subtitle">Extrae y organiza los datos de la HC para tu Excel maestro</p>
        </header>

        <div class="funcionario-box">
            <label for="funcionarioInput">👤 FUNCIONARIO:</label>
            <input
                type="text"
                id="funcionarioInput"
                placeholder="Escribe tu nombre completo..."
                autocomplete="off"
            >
        </div>

        <input type="file" id="pdfInput" accept="application/pdf,.pdf" style="display:none;">

        <div class="upload-area" id="uploadArea">
            <div class="upload-content">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p><strong>Haz clic</strong> o arrastra un PDF aquí</p>
                <span class="hint">Solo archivos .pdf</span>
            </div>
        </div>

        <div class="controls" id="controls" style="display:none;">
            <button id="convertBtn" class="btn-primary">🔍 Extraer datos</button>
        </div>

        <div class="status" id="status"></div>

        <div class="preview" id="preview" style="display:none;">
            <h2>Vista previa <small style="font-weight:400;font-size:0.8rem;color:#718096;">(edita cualquier celda si lo necesitas)</small></h2>
            <div class="table-wrapper">
                <table id="previewTable"></table>
            </div>
            <div class="legend">
                <span><span class="dot ok"></span> Extraído</span>
                <span><span class="dot empty"></span> Vacío / revisar</span>
            </div>
            <div class="actions">
                <button id="downloadBtn" class="btn-success">⬇️ Descargar Excel</button>
                <button id="copyBtn" class="btn-secondary">📋 Copiar fila</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ============ STORAGE SEGURO ============
        const SafeStorage = {
            _memoria: {},
            getItem(key) {
                try { return localStorage.getItem(key); }
                catch (e) { return this._memoria[key] || null; }
            },
            setItem(key, value) {
                try { localStorage.setItem(key, value); }
                catch (e) { this._memoria[key] = value; }
            }
        };

        const uploadArea = document.getElementById('uploadArea');
        const pdfInput = document.getElementById('pdfInput');
        const controls = document.getElementById('controls');
        const convertBtn = document.getElementById('convertBtn');
        const statusEl = document.getElementById('status');
        const preview = document.getElementById('preview');
        const previewTable = document.getElementById('previewTable');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyBtn = document.getElementById('copyBtn');
        const funcionarioInput = document.getElementById('funcionarioInput');

        let currentPdf = null;
        let extractedData = null;

        // ============ PERSISTIR FUNCIONARIO ============
        const FUNC_KEY = 'funcionario_nombre';
        funcionarioInput.value = SafeStorage.getItem(FUNC_KEY) || '';
        funcionarioInput.addEventListener('input', () => {
            SafeStorage.setItem(FUNC_KEY, funcionarioInput.value);
        });

        // ============ SUBIDA DE ARCHIVO ============
        let fileDialogOpen = false;

        uploadArea.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (fileDialogOpen) return;
            fileDialogOpen = true;
            pdfInput.value = '';
            pdfInput.click();
            setTimeout(() => { fileDialogOpen = false; }, 1000);
        });

        pdfInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                    handleFile(file);
                } else {
                    showStatus('Por favor, sube un archivo PDF válido', 'error');
                }
            }
        });

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                    handleFile(file);
                } else {
                    showStatus('Por favor, sube un archivo PDF válido', 'error');
                }
            }
        });

        // ============ BOTONES ============
        convertBtn.addEventListener('click', extraerDatos);
        downloadBtn.addEventListener('click', downloadExcel);
        copyBtn.addEventListener('click', copyToClipboard);

        // ============ CARGA ============
        async function handleFile(file) {
            showStatus('Cargando PDF: ' + file.name + '...', 'info');
            try {
                const arrayBuffer = await file.arrayBuffer();
                currentPdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                showStatus(`✅ PDF cargado: ${currentPdf.numPages} página(s)`, 'success');
                controls.style.display = 'flex';
                preview.style.display = 'none';
            } catch (err) {
                console.error(err);
                showStatus('Error al cargar el PDF: ' + err.message, 'error');
            }
        }

        // ============ EXTRAER TEXTO RESPETANDO LÍNEAS ============
        async function extraerTextoCompleto() {
            let texto = '';
            let totalItems = 0;

            for (let pageNum = 1; pageNum <= currentPdf.numPages; pageNum++) {
                const page = await currentPdf.getPage(pageNum);
                const content = await page.getTextContent();

                if (content.items.length === 0) continue;
                totalItems += content.items.length;

                // Agrupar items por línea usando la coordenada Y (transform[5])
                const lineas = new Map();
                content.items.forEach(item => {
                    if (!item.str || !item.str.trim()) return;
                    const y = Math.round(item.transform[5]);
                    if (!lineas.has(y)) lineas.set(y, []);
                    lineas.get(y).push(item.str);
                });

                // Ordenar de arriba a abajo (Y descendente en PDF.js)
                const ys = [...lineas.keys()].sort((a, b) => b - a);
                ys.forEach(y => {
                    const linea = lineas.get(y).join(' ').replace(/[ \t]+/g, ' ').trim();
                    if (linea) texto += linea + '\n';
                });
                texto += '\n';
            }

            // Aviso si el PDF no tiene capa de texto (escaneado)
            if (totalItems === 0) {
                throw new Error('El PDF no tiene texto extraíble. Parece un PDF escaneado; necesitaría OCR.');
            }

            return texto;
        }

        // ============ NORMALIZACIÓN ============
        function normalizar(s) {
            return (s || '')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // quita tildes
                .replace(/[“”"'`´]/g, '')
                .replace(/[ \t]+/g, ' ')
                .trim();
        }

        // ============ SEPARAR NOMBRE/APELLIDO ============
        function asignarNombreApellido(nombreCompleto, datos) {
            const partes = nombreCompleto.split(/\s+/).filter(Boolean);
            if (partes.length === 0) return;
            if (partes.length === 1) {
                datos['NOMBRE'] = partes[0];
                datos['APELLIDO'] = '';
            } else if (partes.length === 2) {
                datos['NOMBRE'] = partes[0];
                datos['APELLIDO'] = partes[1];
            } else if (partes.length === 3) {
                // 1 nombre + 2 apellidos (caso colombiano típico)
                datos['NOMBRE'] = partes[0];
                datos['APELLIDO'] = partes.slice(1).join(' ');
            } else if (partes.length === 4) {
                // 2 nombres + 2 apellidos
                datos['NOMBRE'] = partes.slice(0, 2).join(' ');
                datos['APELLIDO'] = partes.slice(2).join(' ');
            } else {
                // 5+: asumimos últimos 2 = apellidos
                datos['NOMBRE'] = partes.slice(0, -2).join(' ');
                datos['APELLIDO'] = partes.slice(-2).join(' ');
            }
        }

        // ============ EXTRAER CAMPOS ============
        function extraerCampos(textoOriginal) {
            const texto = normalizar(textoOriginal);
            const T = texto.toUpperCase();

            const datos = {
                'FUNCIONARIO': (funcionarioInput.value || '').trim().toUpperCase() || 'NO ESPECIFICADO',
                'FECHA': '',
                'HORA': '',
                'NOMBRE': '',
                'APELLIDO': '',
                'TIPO DE DOCUMENTO': '',
                'NUMERO DE DOCUMENTO': '',
                'EDAD': '',
                'EPS': '',
                'TIPO DE TRAMITE': 'REMISION'
            };

            // ---- NOMBRE ----
            let nombreCompleto = '';

            // 1) Header repetido: "HISTORIA CLINICA No. CC 79448374 -- ALDEMAR RODRIGUEZ ABAUNZA Empresa: ..."
            const mHeader = T.match(
                /HISTORIA\s+CLINICA\s+NO\.?\s*(?:CC|TI|RC|CE|PA|MS|AS|PE|PT)\s*\d+\s*[-–—]{1,3}\s*([A-Z][A-Z ]{4,}?)\s*(?:EMPRESA|$)/i
            );
            if (mHeader) nombreCompleto = mHeader[1].trim();

            // 2) Fallback: "Nombre completo: Aldemar ..."
            if (!nombreCompleto) {
                const mAlt = T.match(
                    /NOMBRE\s+COMPLETO\s*:?\s*([A-Z][A-Z ]{3,}?)\s*(?:DOCUMENTO|FECHA|EDAD|SEXO|$)/i
                );
                if (mAlt) nombreCompleto = mAlt[1].trim();
            }

            // 3) Fallback final: tras "--- " del cuerpo
            if (!nombreCompleto) {
                const mEvo = T.match(/-{2,}\s*([A-Z][A-Z ]{4,}?)\s*(?:EMPRESA)/);
                if (mEvo) nombreCompleto = mEvo[1].trim();
            }

            if (nombreCompleto) asignarNombreApellido(nombreCompleto, datos);

            // ---- DOCUMENTO ----
            const mCC = T.match(/\b(CC|TI|RC|CE|PA|MS|AS|PE|PT)\s*:?\s*(\d{6,12})\b/);
            if (mCC) {
                datos['TIPO DE DOCUMENTO'] = mCC[1];
                datos['NUMERO DE DOCUMENTO'] = mCC[2];
            } else {
                const mDoc = T.match(/DOCUMENTO\s+DE\s+IDENTIDAD\s*:?\s*(\d{6,12})/);
                if (mDoc) {
                    datos['NUMERO DE DOCUMENTO'] = mDoc[1];
                    datos['TIPO DE DOCUMENTO'] = 'CC';
                }
            }

            // ---- EDAD ----
            const mEdad = T.match(/\bEDAD(?:\s+ACTUAL)?\s*:?\s*(\d{1,3})\s*(?:ANOS|AÑOS)\b/);
            if (mEdad) datos['EDAD'] = mEdad[1];

            // ---- EPS ----
            // Buscar "Empresa: ..." o "Aseguradora: ..." en la MISMA línea (no cruza \n).
            // Cortar en "Afiliado", "Fecha", "Ocupacion" o fin de línea.
            let mEps = T.match(/EMPRESA\s*:?\s*([^\n]+?)(?=\s+(?:AFILIADO|FECHA|OCUPACION)|$)/i)
                    || T.match(/ASEGURADORA\s*:?\s*([^\n]+?)(?=\s+(?:OCUPACION|MOTIVO|FECHA)|$)/i);

            if (mEps) {
                let eps = mEps[1]
                    .replace(/\b(19|20)\d{2}\b/g, ' ')          // fuera años (2024, 2023...)
                    .replace(/\bBENEF\.?\s*N?\s*\d+\b/gi, ' ')  // fuera "BENEF. N1"
                    .replace(/[:\-–—]+/g, ' ')                  // fuera dos puntos y guiones sueltos
                    .replace(/\b[UC]\b/g, ' ')                  // fuera "U" y "C" aisladas (basura del PDF)
                    .replace(/\s+/g, ' ')
                    .trim();

                // Descartar si quedó vacío o solo signos
                if (eps && !/^[\s:\-–—]*$/.test(eps)) {
                    datos['EPS'] = eps;
                }
            }

            // Fallback: buscar el nombre de una EPS conocida en todo el texto
            if (!datos['EPS']) {
                const mEpsNombre = T.match(
                    /\b(NUEVA\s+EPS|SANITAS|SURA|COMPENSAR|FAMISANAR|COOMEVA|SALUD\s+TOTAL|MEDIMAS|ALIANSALUD|COOSALUD|MUTUAL\s+SER|CAPITAL\s+SALUD|CONVIDA|EMSSANAR|ASMET\s+SALUD|ECOPSOS|COMFENALCO|POLICIA\s+NACIONAL|MAGISTERIO|FOMAG)\b/i
                );
                if (mEpsNombre) datos['EPS'] = mEpsNombre[1].toUpperCase();
            }

            // ---- FECHA/HORA ----
            // 1) Preferir "FOLIO <n> FECHA<dd/mm/yyyy> HH:MM:SS"
            const mFh = T.match(/FOLIO\s+\d+\s+FECHA\s*:?\s*(\d{2}\/\d{2}\/\d{2,4})\s+(\d{2}:\d{2}(?::\d{2})?)/);
            if (mFh) {
                datos['FECHA'] = mFh[1];
                datos['HORA'] = mFh[2];
            } else {
                const mF = T.match(/FECHA\s*:?\s*(\d{2}\/\d{2}\/\d{2,4})/);
                const mH = T.match(/(\d{2}:\d{2}(?::\d{2})?)/);
                if (mF) datos['FECHA'] = mF[1];
                if (mH) datos['HORA'] = mH[1];
            }

            return datos;
        }

        // ============ EXTRAER Y MOSTRAR ============
        async function extraerDatos() {
            if (!currentPdf) {
                showStatus('⚠️ Primero sube un archivo PDF', 'error');
                return;
            }
            if (!funcionarioInput.value.trim()) {
                showStatus('⚠️ Por favor escribe el nombre del FUNCIONARIO antes de continuar', 'error');
                funcionarioInput.focus();
                return;
            }

            convertBtn.disabled = true;
            convertBtn.textContent = 'Procesando...';
            showStatus('Extrayendo datos del PDF...', 'info');

            try {
                const texto = await extraerTextoCompleto();
                extractedData = extraerCampos(texto);

                // Refrescar funcionario por si lo cambió después de cargar el PDF
                extractedData['FUNCIONARIO'] =
                    (funcionarioInput.value || '').trim().toUpperCase() || 'NO ESPECIFICADO';

                const camposOK = Object.values(extractedData).filter(v => v && v.trim() !== '').length;
                const total = Object.keys(extractedData).length;

                renderPreview(extractedData);
                showStatus(
                    `✅ ${camposOK}/${total} campos extraídos. Revisa y edita si hace falta.`,
                    camposOK === total ? 'success' : 'info'
                );
                preview.style.display = 'block';
                preview.scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                console.error(err);
                showStatus('Error al procesar: ' + err.message, 'error');
            } finally {
                convertBtn.disabled = false;
                convertBtn.textContent = '🔍 Extraer datos';
            }
        }

        // ============ VISTA PREVIA EDITABLE ============
        function renderPreview(datos) {
            const headers = Object.keys(datos);

            let html = '<thead><tr>';
            headers.forEach(h => html += `<th>${escapeHtml(h)}</th>`);
            html += '</tr></thead><tbody><tr>';

            headers.forEach(h => {
                const v = datos[h] || '';
                if (v && v.trim() !== '') {
                    html += `<td contenteditable="true" data-key="${escapeHtml(h)}" class="val">${escapeHtml(v)}</td>`;
                } else {
                    html += `<td contenteditable="true" data-key="${escapeHtml(h)}" class="missing">—</td>`;
                }
            });
            html += '</tr></tbody>';

            previewTable.innerHTML = html;

            // Sincronizar ediciones con extractedData
            previewTable.querySelectorAll('td[data-key]').forEach(td => {
                td.addEventListener('blur', () => {
                    const k = td.dataset.key;
                    const txt = td.innerText.trim();
                    const limpio = (txt === '—' || txt === '') ? '' : txt;
                    extractedData[k] = limpio;

                    // Recolorear según quede lleno o vacío
                    td.classList.toggle('val', !!limpio);
                    td.classList.toggle('missing', !limpio);
                    if (!limpio) td.textContent = '—';
                });

                // Enter para salir de la edición (evita saltos de línea)
                td.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        td.blur();
                    }
                });
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        // ============ DESCARGA EXCEL ============
        function downloadExcel() {
            if (!extractedData) return;

            const ws = XLSX.utils.json_to_sheet([extractedData], {
                header: Object.keys(extractedData)
            });

            ws['!cols'] = Object.keys(extractedData).map(key => ({
                wch: Math.max(key.length + 2, 15)
            }));

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'HC');

            const doc = extractedData['NUMERO DE DOCUMENTO'] || Date.now();
            const fecha = (extractedData['FECHA'] || '').replace(/\//g, '-');
            XLSX.writeFile(wb, `HC_${doc}_${fecha}.xlsx`);
            showStatus('✅ Excel descargado', 'success');
        }

        // ============ COPIAR (solo datos, sin headers) ============
        async function copyToClipboard() {
            if (!extractedData) return;

            const headers = Object.keys(extractedData);
            const values = headers.map(h => extractedData[h] || '');
            const texto = values.join('\t');   // ← solo datos, sin encabezados

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(texto);
                    showStatus('✅ Fila copiada. Pega en Excel con Ctrl+V', 'success');
                    return;
                }
                throw new Error('Clipboard API no disponible');
            } catch (err) {
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = texto;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    textarea.setSelectionRange(0, 99999);
                    const ok = document.execCommand('copy');
                    document.body.removeChild(textarea);

                    if (ok) {
                        showStatus('✅ Fila copiada. Pega en Excel con Ctrl+V', 'success');
                    } else {
                        throw new Error('execCommand falló');
                    }
                } catch (err2) {
                    showStatus('⚠️ No se pudo copiar. Usa el botón "Descargar Excel".', 'error');
                }
            }
        }

        // ============ UTILIDAD ============
        function showStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = 'status ' + type;
        }
    </script>
</body>
</html>
